<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .why{
  padding:40px 7%;
}

.cards{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:20px;
}

.card{
  border:1px solid #e5e5e5;
  border-radius:14px;
  padding:22px;
  background:#fff;
}

.icon{
  font-size:42px;
  margin-bottom:15px;
}

.card h3{
  font-size:20px;
  margin-bottom:10px;
}

.card p{
  color:#666;
  line-height:1.5;
}

@media(max-width:768px){
  .cards{
    grid-template-columns:1fr 1fr;
  }
}
    </style>
</head>
<body>
    <section class="why">
  <h2>Why Booking.com?</h2>

  <div class="cards">
    <div class="card">
      <div class="icon">📝</div>
      <h3>Book now, pay later</h3>
      <p>FREE cancellation on most rooms</p>
    </div>

    <div class="card">
      <div class="icon">👍</div>
      <h3>300M+ Reviews</h3>
      <p>Trusted reviews from fellow travellers</p>
    </div>

    <div class="card">
      <div class="icon">🌍</div>
      <h3>2M+ Properties</h3>
      <p>Hotels, apartments & guest houses</p>
    </div>

    <div class="card">
      <div class="icon">👤</div>
      <h3>24/7 Support</h3>
      <p>We're always here to help</p>
    </div>
  </div>
</section>
</body>
</html>
