<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign-in</title>
    <link rel="stylesheet" href="Stay.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css"
        integrity="sha512-QeR2VH+lsBE5LSAe1Q5EnTBbe7XTBubt8dG93Y7gidSgdMCr8nVqKcfKAMyN96SV8KDbZVTDXChatu5G2KQGzg=="
        crossorigin="anonymous" referrerpolicy="no-referrer">
    <style>
        body {
            background-color: rgb(235, 178, 220);
            background-image: url("https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRjbPivl3lfl8QRVGXZELqjPtIEZ9PpM8rqD2VdMfO33Q&s=10");
        }

        .login-main {
            position: relative;
            left: 30%;
            border: solid 1px rgb(237, 101, 146);
            height: 500px;
            width: 40%;
            border-radius: 20px;
            margin-top: 70px;
            background-color: white;
        }

        .input-field {
            margin: 20px 20px;
            color: rgb(235, 31, 126);
            display: flex;
            flex-direction: column;
            gap: 1px;
            height: 40px;
            width: 100%;
            font-size: 1rem;
            font-family: Arial, Helvetica, sans-serif;
            position: relative;
            left: 50px;
        }

        input {
            height: 34px;
            width: 70%;
            outline: none;
            border: none;
            border-bottom: solid 1px rgb(235, 31, 126);
        }

        .login-main p {
            padding-top: 30px;
            font-size: 2rem;
            position: relative;
            left: 150px;

        }

        button {
            height: 30px;
            width: 30%;
            background-color: rgb(235, 31, 126);
            color: white;
            border: none;
            outline: none;
            position: relative;
            left: 150px;
            border-radius: 30px;

        }

        .NotAcc {
            margin-top: 3px;
            position: relative;
            left: 100px;

        }

        .NotAcc a {
            text-decoration: none;
            color: grey;
        }

        button,
        input {
            transition: transform 0.3s ease;
        }

        button:hover,
        input:hover {
            transform: scale(1, 1.3)
        }

        @media (max-width:768px) {
            .login-main {
                border: solid 1px rgb(237, 101, 146);
                height: 400px;
                width: 70%;
                border-radius: 10px;
                margin-top: 50px;
                background-color: white;
                left: 15%;

            }

            .input-field {
                margin: 10px 10px;
                color: rgb(235, 31, 126);
                display: flex;
                flex-direction: column;
                gap: 3px;
                height: 50px;
                font-size: 1rem;
                font-family: Arial, Helvetica, sans-serif;
                position: relative;
                left: 40px;

            }

            input {
                height: 20px;
                width: 70%;
                outline: none;
                border: none;
                border-bottom: solid 1px rgb(235, 31, 126);
            }

            .login-main p {
                padding-top: 30px;
                font-size: 1.3rem;
                position: relative;
                left: 90px;
            }

            button {
                height: 30px;
                width: 30%;
                background-color: rgb(235, 31, 126);
                color: white;
                border: none;
                outline: none;
                position: relative;
                left: 100px;
                border-radius: 30px;
            }

            .NotAcc {
                margin-top: 3px;
                position: relative;
                left: 60px;

            }

            .NotAcc a {
                text-decoration: none;
                color: grey;
                font-size: 0.6rem;
            }

            button,
            input {
                transition: transform 0.3s ease;
            }

            button:hover,
            input:hover {
                transform: scale(1, 1.1)
            }
        }

        .back {
            position: relative;
            left: 20px;
            margin-top: 10px;
            margin-left: 10px;
            color: rgb(235, 31, 126);
            font-size: 0.8rem;
            font-family: Arial, Helvetica, sans-serif;

        }
    </style>
</head>

<body>
    <div class="back">
        <a href="HomePage.htm" style="color: rgb(235, 31, 126); text-decoration: none;">
            <p>Back to HomePage</p>
        </a>
    </div>
    <div class="login-main">
        <p style="color:  rgb(235, 31, 126); font-family: Arial, Helvetica, sans-serif;">Sign-in Page</p>
        <div class="input-field">
            <label>Name</label>
            <input type="Text" placeholder="Enter Your name" required>
        </div>
        <div class="input-field">
            <label>Phone-no</label>
            <input type="number" placeholder="Enter 10 digit Number" required>
        </div>
        <div class="input-field">
            <label>Email:-
            </label>
            <input type="email" placeholder="abcd@gmail.com" required>
        </div>

        <div class="input-field">
            <label>Password:-</label>
            <input type="password" placeholder="abc@123" required>
        </div>
        <div class="input-field">
            <label>College</label>
            <input type="text" placeholder="Enter Your college name" required>
        </div>
        <button id="submit-button">Sign in</button>


    </div>

</body>

</html>
